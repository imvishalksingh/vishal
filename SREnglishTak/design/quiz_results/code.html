<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f5a524",
                        "background-light": "#f8f7f5",
                        "background-dark": "#221b10",
                    },
                    fontFamily: {
                        "display": ["Newsreader", "serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Newsreader', serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen">
<!-- Top App Bar -->
<header class="flex items-center p-4 justify-between bg-background-light dark:bg-background-dark">
<div class="flex size-12 shrink-0 items-center justify-center rounded-full hover:bg-primary/10 transition-colors cursor-pointer">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">arrow_back</span>
</div>
<h2 class="text-xl font-bold leading-tight tracking-tight flex-1 text-center pr-12 text-slate-900 dark:text-slate-100">Quiz Results</h2>
</header>
<main class="max-w-md mx-auto px-6 pb-12 flex flex-col items-center">
<!-- Progress Ring Section -->
<div class="relative flex items-center justify-center my-8">
<svg class="w-48 h-48 transform -rotate-90">
<circle class="text-primary/10" cx="96" cy="96" fill="transparent" r="88" stroke="currentColor" stroke-width="12"></circle>
<circle class="text-primary" cx="96" cy="96" fill="transparent" r="88" stroke="currentColor" stroke-dasharray="552.92" stroke-dashoffset="165.87" stroke-linecap="round" stroke-width="12"></circle>
</svg>
<div class="absolute flex flex-col items-center">
<span class="text-4xl font-bold text-slate-900 dark:text-slate-100">7/10</span>
<span class="text-sm font-medium text-primary uppercase tracking-widest">Correct</span>
</div>
</div>
<!-- Motivational Message -->
<div class="text-center space-y-2 mb-10">
<h1 class="text-4xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Great Job!</h1>
<p class="text-slate-600 dark:text-slate-400 max-w-[280px] mx-auto">You're mastering your reading goals. Keep up the scholarly work!</p>
</div>
<!-- Performance Breakdown Card -->
<div class="w-full bg-primary/5 dark:bg-primary/10 rounded-xl p-6 border border-primary/20 space-y-6">
<h3 class="text-lg font-bold border-b border-primary/20 pb-2">Performance Breakdown</h3>
<div class="space-y-4">
<!-- Correct -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="size-8 rounded-lg bg-green-500/20 flex items-center justify-center">
<span class="material-symbols-outlined text-green-500 text-lg">check_circle</span>
</div>
<span class="font-medium">Correct</span>
</div>
<span class="text-lg font-bold">7</span>
</div>
<!-- Wrong -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="size-8 rounded-lg bg-red-500/20 flex items-center justify-center">
<span class="material-symbols-outlined text-red-500 text-lg">cancel</span>
</div>
<span class="font-medium">Wrong</span>
</div>
<span class="text-lg font-bold">2</span>
</div>
<!-- Skipped -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="size-8 rounded-lg bg-slate-500/20 flex items-center justify-center">
<span class="material-symbols-outlined text-slate-500 text-lg">skip_next</span>
</div>
<span class="font-medium">Skipped</span>
</div>
<span class="text-lg font-bold">1</span>
</div>
</div>
<!-- Accuracy Bar -->
<div class="pt-4 border-t border-primary/20">
<div class="flex justify-between items-end mb-2">
<span class="text-sm font-medium text-slate-500">Accuracy Score</span>
<span class="text-sm font-bold text-primary">70%</span>
</div>
<div class="h-2 w-full bg-primary/20 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full w-[70%]"></div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full mt-10 space-y-4">
<button class="w-full py-4 bg-primary text-background-dark font-bold rounded-lg hover:brightness-110 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">library_books</span>
                Back to Library
            </button>
<button class="w-full py-4 bg-transparent border-2 border-primary/40 text-primary font-bold rounded-lg hover:bg-primary/5 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">refresh</span>
                Retake Quiz
            </button>
</div>
<!-- Footer Decoration -->
<div class="mt-12 opacity-20 grayscale">
<img alt="Decorative quill and book emblem" class="h-12 w-auto mx-auto" data-alt="Dark academia style quill and book emblem" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAGrnqYccVLl95pTF5FjB9IJNM7EcTsso-r_MUw8c2I5NUPGSPYpvmx59bmBZ7Bng3Zlrs-50vn6zS8dwlHFc8bDwKSOsREpPA6LBW31o9pPqvk9wpMm8aoL0zsKPurgOK-JmpPQjMTnDTNeopsNGiMXQsBM4InzaZKGtFjE82dq1yxRwuHLumdJNtZPrXCozH3KjgTQVuq4DXeNcvRJJMz5fz-t27llDxQSaAVFCOB0CwtC9uV5Ml89RQHMLyBC_ZlNXf2Lzd7x-g"/>
</div>
</main>
</body></html>
