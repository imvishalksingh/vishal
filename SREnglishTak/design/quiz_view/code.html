<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#f5a524",
              "background-light": "#f8f7f5",
              "background-dark": "#0f172a", // Dark navy for dark academia
            },
            fontFamily: {
              "display": ["Newsreader", "serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      body {
        font-family: 'Newsreader', serif;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen text-slate-900 dark:text-slate-100">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
<!-- Header / TopAppBar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between border-b border-slate-200 dark:border-slate-800">
<div class="text-primary flex size-12 shrink-0 items-center cursor-pointer" data-icon="ArrowLeft">
<span class="material-symbols-outlined text-3xl">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-xl font-display font-bold leading-tight tracking-tight flex-1 text-center">
            The Great Gatsby - Quiz Time 📚
        </h2>
<div class="size-12"></div> <!-- Spacer for balance -->
</div>
<!-- Progress Section -->
<div class="flex flex-col gap-3 p-6">
<div class="flex gap-6 justify-between items-end">
<p class="text-slate-900 dark:text-slate-100 text-lg font-display font-medium leading-normal">Question 3 of 10</p>
<p class="text-primary text-sm font-display font-bold leading-normal tracking-widest uppercase">30% Complete</p>
</div>
<div class="rounded-full bg-slate-200 dark:bg-slate-800 h-3 overflow-hidden">
<div class="h-full rounded-full bg-primary" style="width: 30%;"></div>
</div>
</div>
<!-- Question Card -->
<div class="p-6 @container">
<div class="flex flex-col items-stretch justify-start rounded-xl @xl:flex-row @xl:items-start shadow-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-hidden">
<div class="w-full bg-center bg-no-repeat aspect-video bg-cover" data-alt="Close up of an old open book with dramatic lighting" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDG8FODnfU3ElyrbnCFF8Go78_xZeA2pU_mw_2hgE9m6TdmW3k4nn7WoYqVXTtMNa42B0Cm-KIROhk-ax_24CGv4a1NXvkvD2Hbky1HuwCfJVHB9XT5682vRviPHWmCHQRHGNrssz_2h-poXMOIFsFH0aSS4as-TX5shTsGnLc2m7hjSDasItli52Lhl2rmmUtQ3eVxLSgCZHrAOkKG6o6Ao8NrL4F35v8-cw2gejhm9bc-TQX3mUGrde6OAs0DIapAYTSB53rxUz8");'>
</div>
<div class="flex w-full min-w-72 grow flex-col items-stretch justify-center gap-4 p-6">
<p class="text-slate-900 dark:text-slate-100 text-2xl font-display font-bold leading-tight italic">
                    "So we beat on, boats against the current, borne back ceaselessly into the past."
                </p>
<div class="h-px bg-slate-200 dark:bg-slate-800 w-full"></div>
<p class="text-slate-600 dark:text-slate-400 text-lg font-display font-normal leading-relaxed">
                    Which primary theme is best exemplified by this concluding line of the novel?
                </p>
</div>
</div>
</div>
<!-- Answer Options (Multiple Choice Pills) -->
<div class="flex flex-col gap-4 p-6">
<button class="flex min-h-[60px] w-full items-center justify-start gap-x-4 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-6 py-3 transition-colors hover:border-primary group">
<span class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 font-bold group-hover:bg-primary group-hover:text-background-dark">A</span>
<p class="text-slate-900 dark:text-slate-100 text-base font-display font-medium">The futility of the American Dream</p>
</button>
<button class="flex min-h-[60px] w-full items-center justify-start gap-x-4 rounded-xl border-2 border-primary bg-primary/10 px-6 py-3 transition-colors">
<span class="flex h-8 w-8 items-center justify-center rounded-full bg-primary text-background-dark font-bold">B</span>
<p class="text-slate-900 dark:text-slate-100 text-base font-display font-medium">The restorative power of nature</p>
</button>
<button class="flex min-h-[60px] w-full items-center justify-start gap-x-4 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-6 py-3 transition-colors hover:border-primary group">
<span class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 font-bold group-hover:bg-primary group-hover:text-background-dark">C</span>
<p class="text-slate-900 dark:text-slate-100 text-base font-display font-medium">The inevitability of social progress</p>
</button>
<button class="flex min-h-[60px] w-full items-center justify-start gap-x-4 rounded-xl border-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-6 py-3 transition-colors hover:border-primary group">
<span class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 font-bold group-hover:bg-primary group-hover:text-background-dark">D</span>
<p class="text-slate-900 dark:text-slate-100 text-base font-display font-medium">The triumph of individual morality</p>
</button>
</div>
<!-- Sticky Footer Button -->
<div class="mt-auto flex px-6 py-8 border-t border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/50 backdrop-blur-sm">
<button class="flex min-w-[84px] w-full max-w-2xl mx-auto cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary text-background-dark text-lg font-display font-bold leading-normal tracking-wide shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-transform">
<span class="truncate">Submit Answer</span>
<span class="material-symbols-outlined ml-2">arrow_forward</span>
</button>
</div>
<!-- Extra space for mobile scroll -->
<div class="h-8 bg-transparent"></div>
</div>
</body></html>
