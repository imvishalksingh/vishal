name: sr_english_tak
description: "SR English Tak - Learn English through Reading, Quizzes & Vocabulary"
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.1.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  syncfusion_flutter_pdfviewer: any
  epub_view: any
  file_picker: ^8.0.0
  provider: ^6.1.5+1
  google_sign_in: ^6.2.1
  share_plus: ^7.2.1
  in_app_review: ^2.0.8
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: 0.11.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  